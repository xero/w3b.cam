name: feature

# Adds a cam/stream to the homepage (index.html) featured set, persists the updated DB
# to the db-store release, then rebuilds & deploys the site. The homepage shows a random
# couple of the featured entries per kind each build. Remove one with the unfeature workflow.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to feature
        required: true
        type: choice
        options:
          - cam
          - stream
      ref:
        description: IP address (cam) or YouTube video id (stream)
        required: true
        type: string

# Serialize with every other DB-mutating workflow so runs can't clobber the DB.
concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload/create (persist the DB)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore DB from release store
        uses: ./.github/actions/restore-db

      # kind/ref passed via env (not inline ${{ }}) to avoid shell injection.
      # The script validates both and exits 1 on bad input.
      - name: Set featured
        env:
          KIND: ${{ inputs.kind }}
          REF: ${{ inputs.ref }}
        run: bun run feature "$KIND" "$REF"

      - name: Save DB to release store
        uses: ./.github/actions/save-db

  # Featuring changes the homepage, so rebuild & deploy to reflect it.
  call-build:
    needs: feature
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
