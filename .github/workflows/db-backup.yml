name: db-backup

# Daily point-in-time snapshot of the db-store SQLite asset into a separate
# db-backups release, so a bad write to db-store is recoverable — db-store itself
# keeps only the latest copy, clobbered on every scrape/curation run. Retains the
# newest `keep` snapshots and prunes the rest. A snapshot drastically smaller than
# the newest one (a truncated or fresh-started store) is refused, and the run goes
# red instead: after the 2026-09-05 wipe seven dutiful snapshots of the fresh DB
# pruned every copy of the real one.
on:
  schedule:
    - cron: '30 5 * * *' # daily, offset from the 6-hourly scrape windows (0 */6)
  workflow_dispatch:
    inputs:
      keep:
        description: How many recent snapshots to retain
        required: false
        default: '7'
        type: string
      min-percent:
        description: Minimum size, as a percent of the newest snapshot, the store must reach to be snapshotted. Lower it for a deliberate large shrink.
        required: false
        default: '50'
        type: string

# Share the db-write lock so a snapshot can never read a half-written db-store
# asset mid-upload.
concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # read db-store + create/upload/prune db-backups
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: ${{ inputs.keep || '7' }}
      MIN_PCT: ${{ inputs.min-percent || '50' }}
    steps:
      # Needed so the fetch below can use the local composite action.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Reuse the hardened restore path: it retries transient errors and fails
      # CLOSED if the store holds the asset but the download errors — so a flake
      # turns into a visible red run, never a silent "nothing to back up".
      - name: Fetch current db-store
        uses: ./.github/actions/restore-db

      - name: Snapshot -> db-backups
        shell: bash
        run: |
          set -uo pipefail
          ASSET=camhunting.sqlite
          DST=db-backups

          # restore-db only leaves a file when the store actually has one. No file
          # means a genuinely empty store (true first run) — nothing to snapshot.
          if [ ! -f "$ASSET" ]; then
            echo "No ${ASSET} present (store empty / first run) — nothing to back up."
            exit 0
          fi

          # Refuse to snapshot a store far smaller than the newest snapshot: that is a
          # truncated or fresh-started DB, and recording it would only rotate the good
          # copies out. A transient read error skips the check (the prune step below
          # tolerates the same), never the upload.
          new="$(stat -c%s "$ASSET")"
          old="$(gh release view "$DST" --json assets --jq '.assets | sort_by(.createdAt) | last | .size // 0' 2>/dev/null || echo 0)"
          if [ "${old:-0}" -gt 0 ] && [ $((new * 100)) -lt $((old * MIN_PCT)) ]; then
            echo "::error::Refusing to snapshot: the store is ${new} bytes, under ${MIN_PCT}% of the newest ${old}-byte snapshot: looks truncated or fresh-started. Restore the store from db-backups (see docs/ci.md), or re-run with a lower min-percent if the shrink is deliberate."
            exit 1
          fi

          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          SNAP="camhunting-${STAMP}.sqlite"
          mv "$ASSET" "$SNAP"

          # Create the backups release if absent (harmless if it already exists),
          # then upload the snapshot, retrying transient failures.
          gh release create "$DST" --prerelease --title "SQLite backups" \
            --notes "Rolling db-store snapshots. Newest is a known-good restore point; older ones are pruned automatically." 2>/dev/null || true
          for attempt in 1 2 3 4; do
            if gh release upload "$DST" "$SNAP" --clobber; then
              echo "Uploaded snapshot ${SNAP} to ${DST}."
              exit 0
            fi
            echo "upload attempt ${attempt} failed; retrying in $((attempt * 5))s…" >&2
            sleep $((attempt * 5))
          done
          echo "::error::Failed to upload snapshot ${SNAP} to ${DST} after retries."
          exit 1

      - name: Prune old snapshots (keep newest KEEP)
        shell: bash
        run: |
          set -uo pipefail
          DST=db-backups
          # If the release genuinely doesn't exist yet there's nothing to prune;
          # a transient read error just skips pruning this run (harmless — the next
          # run prunes). Never delete based on an empty/partial listing.
          names="$(gh release view "$DST" --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name' 2>/dev/null)" || {
            echo "Could not read ${DST} assets; skipping prune this run."
            exit 0
          }
          mapfile -t ALL <<< "$names"
          # Drop any empty trailing element from a blank listing.
          [ "${#ALL[@]}" -eq 1 ] && [ -z "${ALL[0]}" ] && ALL=()
          if [ "${#ALL[@]}" -le "$KEEP" ]; then
            echo "${#ALL[@]} snapshot(s) present; keep=${KEEP}; nothing to prune."
            exit 0
          fi
          for asset in "${ALL[@]:$KEEP}"; do
            echo "Pruning old snapshot ${asset}"
            gh release delete-asset "$DST" "$asset" -y
          done
