name: Restore DB from store
description: >-
  Download camhunting.sqlite from the db-store release, fail-closed. If the store
  HAS the asset but the download errors (a transient GitHub/network flake), this
  fails the job instead of silently continuing with no DB — that swallowed-restore
  path, paired with the clobber-upload in save-db, once wiped the whole store.
  A store with NO asset is only a fresh start when nothing says it ever held one:
  no half-swapped sibling asset (camhunting.sqlite.new / .prev) and no db-backups
  snapshot. Otherwise the store was emptied, and the job fails so the next save
  can't bury the real DB under a fresh one, which is exactly how the 2026-09-05
  wipe went unnoticed until the last good snapshot had rotated out.

inputs:
  github-token:
    description: Token for the gh CLI (needs contents:read).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail
        RELEASE=db-store
        BACKUPS=db-backups
        ASSET=camhunting.sqlite
        ERR="${RUNNER_TEMP:-/tmp}/restore-db.err"

        # Probe a release's asset names into $names, retrying transient failures, and
        # set $state to ok | absent (release genuinely missing) | "" (unreachable).
        probe() {
          names=""; state=""
          for attempt in 1 2 3 4; do
            if names="$(gh release view "$1" --json assets --jq '.assets[].name' 2>"$ERR")"; then
              state=ok; return
            fi
            if grep -qiE 'release not found|not found|no releases' "$ERR"; then
              state=absent; return
            fi
            echo "${1} probe attempt ${attempt} failed (transient?); retrying in $((attempt * 5))s…" >&2
            cat "$ERR" >&2 || true
            sleep $((attempt * 5))
          done
        }

        # 1) Probe the store. Tell a genuinely missing release (-> maybe fresh) apart
        #    from an unreachable API (-> fail).
        probe "$RELEASE"
        if [ -z "$state" ]; then
          echo "::error::Could not reach the ${RELEASE} store after retries; failing closed rather than risk clobbering it with a fresh DB."
          cat "$ERR" >&2 || true
          exit 1
        fi
        store_names="$names"

        # 2) No live asset. Fresh is only legitimate if the store never held a DB.
        if [ "$state" = absent ] || ! printf '%s\n' "$store_names" | grep -qx "$ASSET"; then
          siblings="$(printf '%s\n' "$store_names" | { grep "^${ASSET}" || true; } | tr '\n' ' ')"
          if [ -n "$siblings" ]; then
            echo "::error::${RELEASE} has no ${ASSET} but holds ${siblings}: a save died mid-swap. Promote the complete copy by hand (gh api -X PATCH <its apiUrl> -f name=${ASSET}; see docs/ci.md) and re-run."
            exit 1
          fi
          probe "$BACKUPS"
          if [ -z "$state" ]; then
            echo "::error::${RELEASE} has no ${ASSET} and ${BACKUPS} is unreachable; failing closed rather than assume a first run."
            exit 1
          fi
          if [ "$state" = ok ] && [ -n "$names" ]; then
            echo "::error::${RELEASE} has no ${ASSET} but ${BACKUPS} holds snapshot(s): the store was emptied, not never filled. Restore the newest snapshot (see docs/ci.md) instead of starting fresh over it."
            exit 1
          fi
          echo "No ${ASSET} in ${RELEASE} and no ${BACKUPS} snapshots: a true first run, starting fresh."
          exit 0
        fi

        # 3) Asset exists -> the download MUST succeed. Retry, then fail closed so a
        #    flake can never fall through to a fresh DB that later clobbers the store.
        for attempt in 1 2 3 4; do
          if gh release download "$RELEASE" --pattern "$ASSET" --clobber; then
            echo "Restored ${ASSET} from ${RELEASE}."
            exit 0
          fi
          echo "download attempt ${attempt} failed; retrying in $((attempt * 5))s…" >&2
          sleep $((attempt * 5))
        done
        echo "::error::${ASSET} exists in ${RELEASE} but every download attempt failed; failing closed so the store is not overwritten by a fresh DB."
        exit 1
